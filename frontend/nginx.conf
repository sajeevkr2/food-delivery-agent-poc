server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # Re-resolve the backend hostname via Docker's embedded DNS on every
        # request (variable in proxy_pass forces this), instead of caching the
        # IP for the life of the nginx worker - otherwise a backend container
        # restart leaves nginx pointing at a dead IP until nginx itself restarts.
        resolver 127.0.0.11 valid=10s;
        set $backend_upstream backend;
        # A variable in proxy_pass skips nginx's static location-prefix
        # substitution, so the full original path must be appended explicitly.
        proxy_pass http://$backend_upstream:8080$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    location / {
        # Always revalidate so a rebuilt UI shows up on a normal refresh
        # (asset filenames are content-hashed, so revalidation is cheap).
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
