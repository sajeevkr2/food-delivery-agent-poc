spring.application.name=food-delivery-agent

server.port=8080

spring.ai.model.embedding=none

spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:qwen2.5-coder:7b}
spring.ai.ollama.chat.options.temperature=0.0
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.timeout=5m

mcp-server.base-url=${MCP_SERVER_URL:http://localhost:8081}

spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.streamable-http.connections.food-delivery.url=${mcp-server.base-url}
spring.ai.mcp.client.streamable-http.connections.food-delivery.endpoint=/mcp
