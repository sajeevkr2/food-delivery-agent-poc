services:
  # Containerized Ollama, only used if you run with --profile containerized-ollama.
  # By default the backend talks to Ollama running natively on the host (faster,
  # uses your GPU) via host.docker.internal.
  ollama:
    image: ollama/ollama:latest
    profiles: ["containerized-ollama"]
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["containerized-ollama"]
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c", "OLLAMA_HOST=http://ollama:11434 ollama pull ${OLLAMA_MODEL:-qwen2.5-coder:7b}"]

  mcp-server:
    build: ./mcp-server
    ports:
      - "8081:8081"

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5-coder:7b}
      MCP_SERVER_URL: http://mcp-server:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mcp-server

  frontend:
    build: ./frontend
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  ollama_data:
